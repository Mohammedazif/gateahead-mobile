name: Android app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

env:
  API_BASE: ${{ vars.API_BASE || 'https://gateahead-api.onrender.com' }}

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Check Android signing secrets
        env:
          KEYSTORE: ${{ secrets.GATEAHEAD_ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.GATEAHEAD_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE" || -z "$PASSWORD" ]]; then
            echo "::error::Run bash tools/setup-android-signing.sh from a computer with GitHub CLI access first."
            exit 1
          fi
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.9"
          cache: true
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Restore Android signing key
        env:
          KEYSTORE: ${{ secrets.GATEAHEAD_ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          signing_key="$RUNNER_TEMP/gateahead-android.p12"
          printf '%s' "$KEYSTORE" | base64 --decode > "$signing_key"
          echo "GATEAHEAD_ANDROID_KEYSTORE_PATH=$signing_key" >> "$GITHUB_ENV"
      - name: Build APK
        env:
          GATEAHEAD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.GATEAHEAD_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          flutter build apk --release \
            --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define="API_BASE=$API_BASE"
      - name: Verify and package APK
        run: |
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/gateahead-android.apk
          "$tools/apksigner" verify --print-certs dist/gateahead-android.apk > "$RUNNER_TEMP/android-signer.txt"
          cat "$RUNNER_TEMP/android-signer.txt"
          if grep -q 'CN=Android Debug' "$RUNNER_TEMP/android-signer.txt"; then
            echo "::error::The APK must use the permanent GateAhead signing key."
            exit 1
          fi
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/publish-test-build.sh android dist/gateahead-android.apk
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/gateahead-android.p12"
