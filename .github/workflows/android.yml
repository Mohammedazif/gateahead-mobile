name: Android app

on:
  workflow_dispatch:
    inputs:
      enable_push:
        description: Build a signed Firebase push test artifact
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

env:
  API_BASE: ${{ vars.API_BASE || 'https://gateahead-api.onrender.com' }}

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Android signing configuration
        env:
          KEYSTORE: ${{ secrets.GATEAHEAD_ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.GATEAHEAD_ANDROID_KEYSTORE_PASSWORD }}
          EXPECTED_CERT: ${{ vars.GATEAHEAD_ANDROID_CERT_SHA256 }}
        run: |
          if [[ -z "$KEYSTORE" || -z "$PASSWORD" ]]; then
            echo "::error::Run bash tools/setup-android-signing.sh from a computer with GitHub CLI access first."
            exit 1
          fi
          if [[ ! "$EXPECTED_CERT" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "::error::Set GATEAHEAD_ANDROID_CERT_SHA256 by running bash tools/setup-android-signing.sh with the backed-up Android release key."
            exit 1
          fi
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.9"
          cache: true
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Restore Android signing key
        env:
          KEYSTORE: ${{ secrets.GATEAHEAD_ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          signing_key="$RUNNER_TEMP/gateahead-android.p12"
          printf '%s' "$KEYSTORE" | base64 --decode > "$signing_key"
          echo "GATEAHEAD_ANDROID_KEYSTORE_PATH=$signing_key" >> "$GITHUB_ENV"
      - name: Configure Firebase for push
        if: ${{ inputs.enable_push }}
        env:
          FIREBASE_CONFIG: ${{ secrets.GATEAHEAD_ANDROID_FIREBASE_CONFIG_BASE64 }}
          FIREBASE_PROJECT: ${{ vars.GATEAHEAD_FIREBASE_PROJECT_ID }}
        run: |
          test -n "$FIREBASE_CONFIG"
          test -n "$FIREBASE_PROJECT"
          umask 077
          printf '%s' "$FIREBASE_CONFIG" | base64 --decode > android/app/google-services.json
          jq -e --arg project "$FIREBASE_PROJECT" '
            .project_info.project_id == $project and
            any(.client[]; .client_info.android_client_info.package_name == "in.gateahead.app")
          ' android/app/google-services.json > /dev/null
      - name: Build APK
        env:
          GATEAHEAD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.GATEAHEAD_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          flutter build apk --release \
            --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define="API_BASE=$API_BASE"
      - name: Verify and package APK
        env:
          EXPECTED_CERT: ${{ vars.GATEAHEAD_ANDROID_CERT_SHA256 }}
        run: |
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/gateahead-android.apk
          "$tools/apksigner" verify --print-certs dist/gateahead-android.apk > "$RUNNER_TEMP/android-signer.txt"
          cat "$RUNNER_TEMP/android-signer.txt"
          if grep -q 'CN=Android Debug' "$RUNNER_TEMP/android-signer.txt"; then
            echo "::error::The APK must use the permanent GateAhead signing key."
            exit 1
          fi
          # Build-tools versions label the signer by index or by signature scheme.
          actual_cert=$(
            sed -nE 's/^(V[0-9.]+ )?Signer( #[0-9]+)?:? certificate SHA-256 digest: ([[:xdigit:]]{64})$/\3/p' "$RUNNER_TEMP/android-signer.txt" |
              tr '[:upper:]' '[:lower:]' | sort -u
          )
          if [[ "$actual_cert" != "${EXPECTED_CERT,,}" ]]; then
            echo "::error::The APK signer does not match GATEAHEAD_ANDROID_CERT_SHA256. Restore the permanent release key before publishing."
            exit 1
          fi
      - name: Verify packaged Firebase resources
        if: ${{ inputs.enable_push }}
        env:
          FIREBASE_PROJECT: ${{ vars.GATEAHEAD_FIREBASE_PROJECT_ID }}
        run: |
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$tools/aapt2" dump resources dist/gateahead-android.apk > "$RUNNER_TEMP/gateahead-apk-resources.txt"
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "gateahead-apk-resources.txt"
          values = {}
          resource = None
          for line in path.read_text().splitlines():
              if re.search(r"\bresource 0x", line):
                  match = re.search(r"\bstring/(project_id|google_app_id)\b", line)
                  resource = match.group(1) if match else None
              elif resource and (value := re.search(r'\(\)\s+"([^"]+)"', line)):
                  values[resource] = value.group(1)
          if values.get("project_id") != os.environ["FIREBASE_PROJECT"] or not values.get("google_app_id"):
              raise SystemExit("Signed APK is missing the requested Firebase configuration")
          PY
      - name: Remove build credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/gateahead-android.p12" android/app/google-services.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.enable_push && 'verified-android-push-apk' || 'verified-android-apk' }}
          path: dist/gateahead-android.apk
          if-no-files-found: error
          retention-days: 1

  publish:
    if: ${{ !inputs.enable_push }}
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-android-apk
          path: dist
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/publish-test-build.sh android dist/gateahead-android.apk
