name: iPhone app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ios-release
  cancel-in-progress: false

env:
  API_BASE: ${{ vars.API_BASE || 'https://gateahead-api.onrender.com' }}
  BYPASS_PERMISSION_LOCATION_ALWAYS: "1"

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Xcode
        run: xcodebuild -version
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.9"
          cache: true
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      # Sideloadly or AltStore signs this device build with the installer's Apple ID.
      - name: Build iPhone app
        run: |
          flutter build ios --release --no-codesign \
            --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define="API_BASE=$API_BASE"
      - name: Package unsigned IPA
        run: |
          package_dir="$RUNNER_TEMP/gateahead-ipa"
          mkdir -p "$package_dir/Payload" dist
          ditto build/ios/iphoneos/Runner.app "$package_dir/Payload/Runner.app"
          plutil -lint "$package_dir/Payload/Runner.app/Info.plist"
          (
            cd "$package_dir"
            zip -qry "$GITHUB_WORKSPACE/dist/gateahead-ios-unsigned.ipa" Payload
          )
          unzip -t dist/gateahead-ios-unsigned.ipa
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-ios-ipa
          path: dist/gateahead-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: ipa
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-ios-ipa
          path: dist
      - name: Publish IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/publish-test-build.sh ios dist/gateahead-ios-unsigned.ipa
