name: gateahead
description: India-wide railway level-crossing alerts.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.0.1
  geolocator: ^14.0.2
  google_fonts: ^6.3.0
  http: ^1.5.0
  maplibre: 0.4.0-pre.2
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  firebase_core_platform_interface: ^8.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/india_outline.geojson
    - assets/india_rail.geojson
    - assets/branding/gateahead-mark-dark.png
    - assets/branding/gateahead-mark-light.png
