name: gateahead
description: India-wide railway level-crossing alerts.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^14.0.2
  google_fonts: ^6.3.0
  http: ^1.5.0
  maplibre: 0.4.0-pre.2
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/india_outline.geojson
    - assets/india_rail.geojson
